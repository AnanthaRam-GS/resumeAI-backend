services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: resumeai-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: resumeai
      POSTGRES_PASSWORD: resumeai_password
      POSTGRES_DB: resumeai_dev
    volumes:
      - resumeai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeai -d resumeai_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: resumeai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - resumeai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resumeai_postgres_data:
  resumeai_redis_data:
