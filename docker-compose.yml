services:
  postgres:
    image: postgres:15
    container_name: resumeai-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: resumeai
      POSTGRES_PASSWORD: resumeai_password
      POSTGRES_DB: resumeai_dev
    volumes:
      - resumeai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeai -d resumeai_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resumeai_postgres_data:
