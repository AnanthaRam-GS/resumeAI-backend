name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: cp .env.test.example .env.test

      - name: Validate environment examples
        run: pnpm env:validate

      - name: Audit dependencies (fail only on high/critical)
        run: |
          pnpm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const reportPath = path.join(process.cwd(), 'audit.json');
          const data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const vulnerabilities = data.metadata?.vulnerabilities || {};
          const high = Number(vulnerabilities.high || 0);
          const critical = Number(vulnerabilities.critical || 0);

          if (high > 0 || critical > 0) {
            console.error(`Found high/critical vulnerabilities: high=${high} critical=${critical}`);
            process.exit(1);
          }

          console.log(`No high/critical vulnerabilities found. Low/moderate counts: low=${vulnerabilities.low || 0}, moderate=${vulnerabilities.moderate || 0}`);
          NODE

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
